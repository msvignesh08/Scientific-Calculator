name: Build SciCalc APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract Android project
        run: |
          unzip -q SciCalc-Casio-Color-Display-Android-project.zip -d extracted
          test -f extracted/settings.gradle || (echo "Gradle settings file not found in ZIP"; exit 1)

      - name: Build APK
        run: gradle -p extracted assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SciCalc-debug-apk
          path: extracted/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
